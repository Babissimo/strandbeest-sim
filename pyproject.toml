[project]
name = "strandbeest-sim"
version = "0.1.0"
description = "Browser simulator for the Evolving Machines course"
readme = "README.md"
# Pyodide 314 runs Python 3.14, so the tests do too.
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pymunk==7.3.1",
    "pytest>=8.4",
    "pytest-playwright>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["site"]
testpaths = ["tests"]
# Test files in tests/ and tests/e2e/ may share a name (test_leg.py in both).
addopts = ["--import-mode=importlib"]
markers = [
    "e2e: drives the page in Chromium; needs scripts/vendor.py run first",
    "page_errors_expected: an e2e test whose page may log errors without failing it",
]
