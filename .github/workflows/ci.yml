name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base, so stacked PRs get checked too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        # setup-uv publishes no floating major tag past v7.x, so pin exactly.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest -m "not e2e"
