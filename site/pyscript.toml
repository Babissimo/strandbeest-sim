# PyScript settings for index.html. The runtime comes from site/vendor/ (scripts/vendor.py);
# Pyodide finds its other files beside pyodide.mjs.
interpreter = "./vendor/pyodide/pyodide.mjs"

# Every module the page imports and every file they read, copied into Python's working folder,
# which is on sys.path.
[files]
"./beest/__init__.py" = "./beest/__init__.py"
"./beest/arena.py" = "./beest/arena.py"
"./beest/fitness.py" = "./beest/fitness.py"
"./beest/ga.py" = "./beest/ga.py"
"./beest/geometry.py" = "./beest/geometry.py"
"./beest/leg.py" = "./beest/leg.py"
"./beest/limits.json" = "./beest/limits.json"
"./beest/measures.py" = "./beest/measures.py"
"./beest/student_default.py" = "./beest/student_default.py"
"./beest/template.py" = "./beest/template.py"
"./app/__init__.py" = "./app/__init__.py"
"./app/beest_picture.py" = "./app/beest_picture.py"
"./app/controls.py" = "./app/controls.py"
"./app/draw.py" = "./app/draw.py"
"./app/editor.py" = "./app/editor.py"
"./app/evolve_mode.py" = "./app/evolve_mode.py"
"./app/fourbar_mode.py" = "./app/fourbar_mode.py"
"./app/ga_worker.py" = "./app/ga_worker.py"
"./app/graph.py" = "./app/graph.py"
"./app/job.py" = "./app/job.py"
"./app/leg_mode.py" = "./app/leg_mode.py"
"./app/main.py" = "./app/main.py"
"./app/printing.py" = "./app/printing.py"
"./app/storage.py" = "./app/storage.py"

# JavaScript modules imported before the page's Python runs, each as pyscript.js_modules.<name>.
[js_modules.main]
"./app/editor.js" = "editor"
